# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code quality checks

# Note: This workflow will be automatically skipped if the commit message includes
# any of the following strings: [skip ci], [ci skip], [no ci], [skip actions], or [actions skip]

on:
  push:
    branches:
      - main
      - next

  pull_request:
    branches:
      - main
      - next

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    uses: williamthorsen/.github/.github/workflows/code-quality-pnpm-workflow.yaml@v8
    # The legs together run every constituent of `nmr ci`, plus `shellcheck`. Build runs in a leg of
    # its own, because it is the longest check. The playground reads the telefactor package's types
    # from its build output: Its typecheck:pre and test:pre hooks compile the package, and the lint
    # leg, which does not enter packages, compiles it first.
    with:
      check-commands: >-
        [
          { "name": "build", "command": "pnpm exec nmr build" },
          { "name": "lint", "command": "pnpm --filter @williamthorsen/telefactor exec nmr-compile && pnpm exec nmr lint:strict" },
          { "name": "shell", "command": "pnpm exec nmr lint:shell" },
          { "name": "static", "command": "pnpm exec nmr typecheck && pnpm exec nmr fmt:check" },
          { "name": "test", "command": "pnpm exec nmr test" },
          { "name": "workflows", "command": "pnpm exec nmr lint:workflows" }
        ]
      shellcheck-version: '0.11.0'
